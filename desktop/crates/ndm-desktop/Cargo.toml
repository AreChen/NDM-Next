[package]
name = "ndm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
caseless = "0.2"
gpui-kit.workspace = true
ndm-core = { path = "../ndm-core" }
percent-encoding.workspace = true
windows-sys.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile = "3"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
tray-icon = { version = "=0.26.1", default-features = false }
winreg = "0.56"

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
# Enable headless GPUI hit testing without changing release features.
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
