[package]
name = "ndm-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
caseless = "0.2"
gpui-kit.workspace = true
# Upstream Kit adapter, with its Kit pin updated to our 0.10 backend.
gpui-motion-kit = { path = "../../vendor/gpui-motion-kit", version = "=0.5.0" }
ndm-core = { path = "../ndm-core" }
ndm-host = { path = "../ndm-host" }
percent-encoding.workspace = true
reqwest.workspace = true
rquickjs = "0.14.0"
serde.workspace = true
serde_json.workspace = true
semver = "1"
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile = "3"
unicode-normalization = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
winreg = "0.56"
raw-window-handle = "0.6"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = { version = "=0.26.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSError"] }
raw-window-handle = "0.6"
rustix = { version = "1", features = ["fs"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
# Enable headless GPUI hit testing without changing release features.
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
