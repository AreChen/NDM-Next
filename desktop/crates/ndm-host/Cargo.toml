[package]
name = "ndm-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
jsonc-parser = { version = "0.34", features = ["cst"] }
ndm-core = { path = "../ndm-core" }
ndm-plugin-sdk = { path = "../ndm-plugin-sdk" }
reqwest.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
tempfile = "3"
tokio.workspace = true
toml_edit = "0.25"
yaml-edit = { version = "0.3.6", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
zip = { version = "9.8.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Pipes"] }
