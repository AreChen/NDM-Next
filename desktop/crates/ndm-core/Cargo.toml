[package]
name = "ndm-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util.workspace = true
hls-engine.workspace = true
isolang.workspace = true
m3u8-rs.workspace = true
ndm-plugin-sdk = { path = "../ndm-plugin-sdk" }
percent-encoding.workspace = true
reqwest.workspace = true
roxmltree.workspace = true
russh.workspace = true
russh-sftp.workspace = true
rusqlite.workspace = true
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = "3"
suppaftp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
aes-gcm = "0.11"
getrandom = "0.3"

[dev-dependencies]
axum = "0.8"
bytes = "1"
rand = "0.10"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[[test]]
name = "plugin_engine"
harness = false
