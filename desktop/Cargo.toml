[workspace]
members = ["crates/ndm-core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2", "system-proxy"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }
