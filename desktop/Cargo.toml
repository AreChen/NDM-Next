[workspace]
members = [
    "crates/ndm-core",
    "crates/ndm-desktop",
    "crates/ndm-host",
    "crates/ndm-plugin-sdk",
]
exclude = ["vendor/gpui-motion-kit"]
resolver = "3"

[profile.release]
strip = "symbols"
lto = "thin"

[workspace.package]
version = "0.6.8"
edition = "2024"
rust-version = "1.100"
license = "MIT"

[workspace.dependencies]
futures-util = "0.3"
gpui-kit = "=0.10.0"
hls-engine = "=1.2.0"
m3u8-rs = "6"
isolang = { version = "2.4", default-features = false }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2", "system-proxy"] }
roxmltree = "0.21"
russh = "0.65.1"
russh-sftp = "3.0.1"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-async-native-tls", "deprecated", "no-log"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_Packaging_Appx",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
