name: Browser extension build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extension-build.yml'
      - 'extension/**'
      - 'tests/**'
      - 'docs/extension-install.md'
      - 'desktop/packaging/package-extension.py'
      - 'desktop/packaging/windows/enable-dev-extension.ps1'
      - 'desktop/packaging/windows/ndm-next.nsi'
      - 'desktop/crates/ndm-host/src/browser_unix.rs'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: Desktop release tag to validate against the package version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Test and package browser extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test browser extension
        run: node --test tests/*.test.js
      - name: Package versioned extension
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then
            args=(--tag "$RELEASE_TAG")
          fi
          python3 desktop/packaging/package-extension.py extension-dist "${args[@]}"
      - name: Upload companion extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ndm-next-extension
          path: extension-dist/*
          if-no-files-found: error
          retention-days: 3
