name: Verify in-app macOS upgrade
on:
  push:
    branches: [verify/macos-update-8fcce3d]

permissions:
  contents: read

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: cargo +1.100.0 test --locked -p ndm-desktop --test macos_update -- --nocapture
        working-directory: desktop
