name: Windows installer build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'desktop/**'

permissions:
  contents: read

jobs:
  media-tools:
    name: Build LGPL media tools
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-win32 gnupg make nasm xz-utils
      - name: Build verified FFmpeg source
        env:
          NDM_GCC_COPYRIGHT: /usr/share/doc/gcc-13-base/copyright
          NDM_BUILD_JOBS: 4
        run: bash ./desktop/packaging/ffmpeg/build.sh "$RUNNER_TEMP/ndm-media"
      - name: Upload media tools for this build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-media-tools
          path: ${{ runner.temp }}/ndm-media/
          if-no-files-found: error
          retention-days: 3

  installer:
    name: Build unsigned Windows installer
    needs: media-tools
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust and packaging tools
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          cargo +1.100.0 install cargo-about --version 0.9.3 --features cli --locked `
            --root "$env:RUNNER_TEMP/ndm-packaging-tools"
          if ($LASTEXITCODE -ne 0) { throw 'cargo-about installation failed.' }
          $cargoAbout = Join-Path $env:RUNNER_TEMP 'ndm-packaging-tools/bin/cargo-about.exe'
          if (-not (Test-Path -LiteralPath $cargoAbout -PathType Leaf)) { throw 'cargo-about executable is missing.' }
          choco install nsis --version=3.12.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed.' }
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\NSIS\makensis.exe" -PathType Leaf)) {
            throw 'NSIS executable is missing.'
          }
      - name: Fetch locked dependencies and validate licenses
        shell: pwsh
        working-directory: desktop
        run: |
          cargo +1.100.0 fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed.' }
          & "$env:RUNNER_TEMP/ndm-packaging-tools/bin/cargo-about.exe" generate `
            --frozen --workspace --target x86_64-pc-windows-msvc --fail `
            --output-file "$env:RUNNER_TEMP/ndm-licenses.html" about.hbs
          if ($LASTEXITCODE -ne 0) { throw 'License verification failed.' }
      - name: Retrieve media tools from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-media-tools
          path: ${{ runner.temp }}/ndm-media
      - name: Build installer
        shell: pwsh
        run: |
          ./desktop/packaging/windows/build.ps1 `
            -Nsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            -CargoAbout "$env:RUNNER_TEMP/ndm-packaging-tools/bin/cargo-about.exe" `
            -MediaToolDir "$env:RUNNER_TEMP/ndm-media"
      - name: Upload unsigned installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ndm-next-windows-installer-unsigned
          path: desktop/dist/NDM-Next-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 3
