name: Desktop release

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - 'desktop-v*'
    paths:
      - 'desktop/Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing desktop-vX.Y.Z tag to publish, or leave blank to build desktop artifacts only'
        required: false
        type: string
      artifact_run_id:
        description: 'Optional Actions run containing the release artifacts'
        required: false
        type: string
      extension_run_id:
        description: 'Optional Actions run containing a companion extension built from the release commit'
        required: false
        type: string
      macos_arm64_run_id:
        description: 'Optional Actions run containing a rebuilt macOS arm64 package'
        required: false
        type: string
      desktop_only:
        description: 'Publish the desktop packages without the companion extension'
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name) || '' }}

jobs:
  windows:
    if: ${{ !inputs.artifact_run_id }}
    uses: ./.github/workflows/windows-installer.yml
    secrets: inherit

  macos:
    if: ${{ !inputs.artifact_run_id }}
    uses: ./.github/workflows/macos-build.yml
    secrets: inherit

  linux:
    if: ${{ !inputs.artifact_run_id }}
    uses: ./.github/workflows/linux-build.yml

  extension:
    name: Package companion extension
    if: ${{ !inputs.artifact_run_id && !inputs.desktop_only && (inputs.release_tag || startsWith(github.ref, 'refs/tags/desktop-v')) }}
    uses: ./.github/workflows/extension-build.yml
    with:
      release_tag: ${{ inputs.release_tag || github.ref_name }}

  publish:
    name: Publish GitHub release
    needs: [windows, macos, linux, extension]
    if: >-
      ${{ !cancelled() && (inputs.release_tag || startsWith(github.ref, 'refs/tags/desktop-v')) &&
        (inputs.artifact_run_id ||
        (needs.windows.result == 'success' && needs.macos.result == 'success' &&
        needs.linux.result == 'success' && (inputs.desktop_only || needs.extension.result == 'success'))) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
          ARM64_RUN_ID: ${{ inputs.macos_arm64_run_id || inputs.artifact_run_id || github.run_id }}
          EXTENSION_RUN_ID: ${{ inputs.extension_run_id || inputs.artifact_run_id || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_sha=$(git rev-parse HEAD)
          for run_id in "$ARTIFACT_RUN_ID" "$ARM64_RUN_ID" "$EXTENSION_RUN_ID"; do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            run_sha=$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.head_sha')
            [[ "$run_sha" == "$release_sha" ]]
          done
      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ndm-next-windows-installer-unsigned
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ndm-next-macos-x64
          path: macos-x64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Download macOS Apple silicon artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ndm-next-macos-arm64
          path: macos-arm64
          github-token: ${{ github.token }}
          run-id: ${{ inputs.macos_arm64_run_id || inputs.artifact_run_id || github.run_id }}
      - name: Download companion extension
        if: ${{ !inputs.desktop_only }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ndm-next-extension
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.extension_run_id || inputs.artifact_run_id || github.run_id }}
      - name: Download Linux artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ndm-next-linux-x64
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Validate release version and checksums
        env:
          DESKTOP_ONLY: ${{ inputs.desktop_only || false }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop-v}"
          workspace_version=$(python3 -c 'import tomllib; print(tomllib.load(open("desktop/Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [[ "$workspace_version" == "$version" ]]
          windows="OnesDM.exe"
          intel="OnesDM-$version-macos-x64.dmg"
          arm64="OnesDM-$version-macos-arm64.dmg"
          linux="OnesDM-$version-linux-x64.tar.gz"
          cp "macos-x64/$intel"{,.sha256} "macos-arm64/$arm64"{,.sha256} release-assets/
          packages=("$windows" "$intel" "$arm64" "$linux")
          checksums=("$intel.sha256" "$arm64.sha256" "$linux.sha256")
          if [[ "$DESKTOP_ONLY" != true ]]; then
            extension_version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
            extension="OnesDM-Extension-Desktop-$version-v$extension_version.zip"
            unzip -t "release-assets/$extension"
            unzip -p "release-assets/$extension" manifest.json | cmp - extension/manifest.json
            packages+=("$extension")
            checksums+=("$extension.sha256")
          fi
          cd release-assets
          tar -tzf "$linux" > /dev/null
          sha256sum --check "${checksums[@]}"
          sha256sum "${packages[@]}" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name SHA256SUMS \) -print)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --title "OnesDM ${RELEASE_TAG#desktop-v}" \
            --verify-tag \
            --draft \
            --notes-file "docs/releases/desktop-${RELEASE_TAG#desktop-v}.md" \
            --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
