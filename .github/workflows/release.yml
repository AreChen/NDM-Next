name: Desktop release

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing desktop-vX.Y.Z tag to publish'
        required: true
        type: string
      artifact_run_id:
        description: 'Optional release run to reuse after a publishing failure'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  windows:
    if: ${{ !inputs.artifact_run_id }}
    uses: ./.github/workflows/windows-installer.yml
    secrets: inherit

  macos:
    if: ${{ !inputs.artifact_run_id }}
    uses: ./.github/workflows/macos-build.yml
    secrets: inherit

  extension:
    name: Package companion extension
    if: ${{ !inputs.artifact_run_id }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test browser extension
        run: node --test tests/*.test.js
      - name: Package versioned extension
        run: python3 desktop/packaging/package-extension.py extension-dist --tag "$RELEASE_TAG"
      - name: Upload companion extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ndm-next-extension
          path: extension-dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish GitHub release
    needs: [windows, macos, extension]
    if: ${{ !cancelled() && (inputs.artifact_run_id || (needs.windows.result == 'success' && needs.macos.result == 'success' && needs.extension.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop-v}"
          [[ "$RELEASE_TAG" == desktop-v* && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          run_sha=$(gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN_ID" --jq '.head_sha')
          [[ "$run_sha" == "$(git rev-parse HEAD)" ]]
      - name: Download Windows artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ndm-next-windows-installer-unsigned
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Download macOS artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ndm-next-macos-*
          path: release-assets
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Download companion extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ndm-next-extension
          path: release-assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Validate release version and checksums
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#desktop-v}"
          [[ "$RELEASE_TAG" == desktop-v* && "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ -f "release-assets/NDM-Next-Setup-$version-x64.exe" ]]
          mapfile -t dmgs < <(find release-assets -type f -name 'NDM-Next-*-macos-*.dmg' -print)
          [[ "${#dmgs[@]}" -eq 2 ]]
          [[ -f "release-assets/NDM-Next-$version-macos-arm64.dmg" ]]
          [[ -f "release-assets/NDM-Next-$version-macos-x64.dmg" ]]
          extension_version=$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')
          extension="release-assets/NDM-Next-Extension-Desktop-$version-v$extension_version.zip"
          [[ -f "$extension" && -f "$extension.sha256" ]]
          unzip -t "$extension"
          unzip -p "$extension" manifest.json | cmp - extension/manifest.json
          while IFS= read -r -d '' digest; do
            (cd "$(dirname "$digest")" && shasum -a 256 --check "$(basename "$digest")")
          done < <(find release-assets -type f -name '*.sha256' -print0)
          for dmg in "${dmgs[@]}"; do
            [[ -f "$dmg.sha256" ]]
          done
          (cd release-assets && sha256sum ./*.exe ./*.dmg ./*.zip > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.sha256' -o -name SHA256SUMS \) -print)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --title "NDM Next ${RELEASE_TAG#desktop-v}" \
            --verify-tag \
            --draft \
            --notes-file "docs/releases/desktop-${RELEASE_TAG#desktop-v}.md" \
            --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
