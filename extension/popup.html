<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OnesDM</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header class="app-header">
    <picture><source media="(prefers-color-scheme: light)" srcset="icons/icon-light-128.png"><img src="icons/icon-48.png" width="36" height="36" alt=""></picture>
    <h1>OnesDM</h1>
    <span id="status" class="status" data-state="waiting" role="status" data-i18n="connecting">Connecting…</span>
  </header>

  <section class="surface resources">
    <div class="resource-site">
      <div class="stack"><span class="label" data-i18n="currentSite">Current site</span><strong id="domain">—</strong></div>
      <button id="blockSite" class="quiet" type="button"></button>
    </div>
    <p class="muted small" id="siteState"></p>
    <button id="openMedia" class="primary resource-action" type="button">
      <span data-i18n="openMedia">Open page resources</span><span id="mediaCount" class="badge">0</span><span aria-hidden="true">↗</span>
    </button>
    <div id="pageActions" class="page-actions" hidden></div>
    <div id="mediaList" class="recent" hidden></div>
  </section>

  <section class="surface toggles">
    <label class="setting-row">
      <span><strong data-i18n="enabled">Download takeover</strong><small data-i18n="enabledHint">Send eligible browser downloads to the manager.</small></span>
      <span class="switch"><input id="enabled" type="checkbox"><span aria-hidden="true"></span></span>
    </label>
    <label class="setting-row">
      <span><strong data-i18n="mediaToggle">Detect page resources</strong><small data-i18n="mediaHint">Find images, video, audio and stream playlists.</small></span>
      <span class="switch"><input id="media" type="checkbox"><span aria-hidden="true"></span></span>
    </label>
  </section>

  <p id="message" class="message" role="status" aria-live="polite"></p>

  <details class="surface disclosure">
    <summary data-i18n="settings">Settings</summary>
    <div class="settings-body">
      <label class="field"><span data-i18n="language">Language</span><select id="language"></select></label>
      <label class="field"><span data-i18n="backend">Download manager</span><select id="backend"><option value="next">OnesDM</option><option value="neatdm">Neat Download Manager</option></select></label>
      <p class="muted small" data-i18n="backendHint">Neat Download Manager uses its original connection.</p>
      <label class="field"><span data-i18n="captureMode">Takeover mode</span><select id="captureMode"><option value="automatic" data-i18n="automatic">Automatic</option><option value="confirm" data-i18n="confirm">Ask for each download</option></select></label>
      <p class="muted small" data-i18n="captureHint">Confirmation is available with OnesDM.</p>
      <label class="field"><span data-i18n="transferPolicy">Takeover safety</span><select id="transferPolicy"><option value="immediate" data-i18n="immediateTransfer">Take over immediately</option><option value="safe" data-i18n="safeTransfer">Verify before takeover</option></select></label>
      <p class="muted small" data-i18n="transferHint"></p>
      <label class="field"><span data-i18n="size">Minimum file size (MB)</span><input id="minSize" type="number" min="0" step="0.1"></label>
      <p class="muted small" data-i18n="sizeHint"></p>
      <label class="field"><span data-i18n="extensions">Excluded extensions</span><textarea id="extensions" rows="2"></textarea></label>
      <p class="muted small" data-i18n="extensionsHint"></p>
      <label class="field"><span data-i18n="domains">Blocked domains</span><textarea id="domains" rows="3"></textarea></label>
      <p class="muted small" data-i18n="domainsHint"></p>
      <label class="setting-row">
        <span><strong data-i18n="inlineMedia">Buttons beside media</strong><small data-i18n="inlineHint"></small></span>
        <span class="switch"><input id="inlineMedia" type="checkbox"><span aria-hidden="true"></span></span>
      </label>
      <button id="save" class="primary" type="button" data-i18n="save">Save settings</button>
    </div>
  </details>

  <details class="surface disclosure">
    <summary><span data-i18n="versions">Versions and plugins</span><span id="extensionVersion" class="version"></span></summary>
    <div class="settings-body version-list">
      <div><span data-i18n="extensionVersion">Browser extension</span><code id="browserVersion">—</code></div>
      <div><span data-i18n="desktopVersion">OnesDM desktop</span><code id="desktopVersion">—</code></div>
      <h2 data-i18n="installedPlugins">Installed plugins</h2>
      <div id="plugins"></div>
    </div>
  </details>
</main>
<script src="rules.js"></script>
<script src="i18n.js"></script>
<script src="media-ui.js"></script>
<script src="media-library.js"></script>
<script src="popup.js"></script>
</body>
</html>
